    type: json
    content: |-
      {
        "id": "7",
        "title": "New Website Development",
        "description": "A Project to develop a new company website",
        "owner": {
          "id": "42",
          "email": "tes_dev@upteams.de",
          "firstName": "Test",
          "lastName": "Dev"
        }
      }
order: 1000
