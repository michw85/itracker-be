$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/users/register"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "tes_dev@upteams.de",
        "password": "dev_TR_pass_007",
        "displayName": "John Doe"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "field": "email",
          "error": "must be a well-formed email address"
        },
        {
          "field": "password",
          "error": "must not be blank"
        }
      ]
order: 2000
