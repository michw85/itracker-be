$kind: http-request
description: Obtain new access token using a refresh token
url: "{{baseUrl}}/api/v1/auth/refresh-token"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "eyJhbGciOiJIUzI1NiJ9...0ADS106w"
    }
examples: ./.resources/Get new access token.resources/examples
order: 1000
