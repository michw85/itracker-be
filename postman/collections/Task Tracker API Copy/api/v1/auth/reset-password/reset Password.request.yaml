$kind: http-request
url: "{{baseUrl}}/api/v1/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "token": "string",
      "newPassword": "string"
    }
examples: ./.resources/reset Password.resources/examples
order: 1000
