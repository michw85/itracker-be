$kind: http-example
request:
  url: http://{{baseUrl}}/api/v1/auth/refresh-token
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "eyJhbGciOiJIUzI1NiJ9...0ADS106w"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "accessToken": "eyJhbGciOiJIUzI1NiJ9...0ADS106w",
        "refreshToken": "eyJhbGciOiJIUzI1NiJ9...joEW3Hv8Yrs"
      }
order: 1000
