$kind: http-example
request:
  url: http://{{baseUrl}}/api/v1/auth/refresh-token
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "eyJhbGciOiJIUzI1NiJ9...0ADS106w"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "timestamp": 1627660173000,
        "status": 401,
        "error": "Unauthorized",
        "message": "Refresh token is invalid or expired",
        "path": "/api/v1/auth/refresh-token"
      }
order: 2000
