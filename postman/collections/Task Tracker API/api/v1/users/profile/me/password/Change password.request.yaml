$kind: http-request
url: http://{{baseUrl}}/api/v1/users/profile/me/password
method: PUT
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "oldPassword": "Password@123",
      "newPassword": "Password@456",
      "newPasswordConfirm": "Password@456"
    }
examples: ./.resources/Change password.resources/examples
order: 1000
