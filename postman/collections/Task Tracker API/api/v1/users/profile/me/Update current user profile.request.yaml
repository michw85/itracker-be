$kind: http-request
url: http://{{baseUrl}}/api/v1/users/profile/me
method: PUT
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "displayName": "John Doe",
      "position": "Senior Developer",
      "department": "Engineering",
      "bio": "Full-stack developer with 5 years of experience"
    }
examples: ./.resources/Update current user profile.resources/examples
order: 2000
