$kind: http-example
request:
  url: http://{{baseUrl}}/api/v1/projects
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "title": "New Website Development",
        "description": "A Project to develop a new company website"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "field": "title",
          "messages": [
            "must not be blank"
          ]
        }
      ]
order: 2000
